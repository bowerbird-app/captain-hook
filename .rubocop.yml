AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'docs/examples/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

# Prefer dig for safer hash access in webhook handling
Style/SingleArgumentDig:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'lib/captain_hook/provider_config.rb'
    - 'lib/captain_hook/services/action_discovery.rb'
    - 'lib/captain_hook/services/action_lookup.rb'
    - 'lib/captain_hook/services/action_sync.rb'
    - 'lib/captain_hook/services/provider_sync.rb'

# Relax metrics for test files, generators, controllers, and jobs
Metrics/ClassLength:
  Max: 150
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
    - 'lib/captain_hook/hooks.rb'
    - 'app/controllers/**/*'
    - 'app/jobs/**/*'

Metrics/ModuleLength:
  Max: 200
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/**/*'
    - 'app/jobs/**/*'
    - 'db/migrate/**/*'
    - 'benchmark/support/fixtures.rb'
    - 'lib/captain_hook/provider_config.rb'
    - 'lib/captain_hook/services/action_sync.rb'
    - 'lib/captain_hook/services/provider_sync.rb'

Metrics/AbcSize:
  Max: 30
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/**/*'
    - 'app/jobs/**/*'
    - 'db/migrate/**/*'
    - 'app/models/captain_hook/provider.rb'
    - 'lib/captain_hook/configuration.rb'
    - 'lib/captain_hook/provider_config.rb'
    - 'lib/captain_hook/services/action_sync.rb'
    - 'lib/captain_hook/services/provider_sync.rb'

Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - 'app/controllers/**/*'
    - 'app/jobs/**/*'
    - 'app/models/captain_hook/provider.rb'
    - 'lib/captain_hook/provider_config.rb'
    - 'lib/captain_hook/services/provider_sync.rb'

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - 'app/controllers/**/*'
    - 'app/jobs/**/*'
    - 'app/models/captain_hook/provider.rb'
    - 'lib/captain_hook/provider_config.rb'
    - 'lib/captain_hook/services/action_sync.rb'
    - 'lib/captain_hook/services/provider_sync.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'
    - 'captain_hook.gemspec'
    - 'lib/tasks/benchmark.rake'
    - 'lib/tasks/captain_hook.rake'
    - 'lib/tasks/setup.rake'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

# Allow constants defined in test blocks
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

# Allow unused method arguments in test actions
Lint/UnusedMethodArgument:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/captain_hook/services/**/*'
    - 'test/services/**/*'

# Allow short parameter names in cryptographic contexts
Naming/MethodParameterName:
  AllowedNames:
    - a
    - b
    - e
    - k
    - v

# Naming for compare methods
Naming/PredicateMethod:
  Exclude:
    - 'lib/captain_hook/signature_generator.rb'
    - 'lib/captain_hook/verifier_helpers.rb'
    - 'lib/captain_hook/verifiers/base.rb'
    - 'spec/**/*'
    - 'test/**/*'

Metrics/BlockNesting:
  Exclude:
    - 'lib/captain_hook/services/action_discovery.rb'

Style/OpenStructUse:
  Exclude:
    - 'test/**/*'
    - 'spec/**/*'

Style/MultilineBlockChain:
  Exclude:
    - 'test/**/*'
